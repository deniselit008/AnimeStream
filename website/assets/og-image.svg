<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <radialGradient id="glow-orange" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f47521" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f47521" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#glow-orange)"/>
  <rect width="1200" height="630" fill="url(#glow-purple)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(100, 110)">
    <!-- Brand Badge -->
    <rect width="260" height="42" rx="21" fill="#1e293b" stroke="#f47521" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="7" fill="#10b981"/>
    <text x="42" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600">WINDOWS 10 / 11 (64-BIT)</text>

    <!-- Main Title -->
    <text x="0" y="120" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">AnimeStream</text>
    <text x="0" y="180" fill="#f47521" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800">para Windows</text>

    <!-- Description -->
    <text x="0" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="400">
      <tspan x="0" dy="0">Agregador de anime en tiempo real sin anuncios invasivos.</tspan>
      <tspan x="0" dy="32">Multi-fuente, soporte Smart TV, portable y 100% gratuito.</tspan>
    </text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 310)">
      <!-- Badge 1: AnimeAV1 -->
      <rect x="0" y="0" width="130" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6"/>
      <text x="65" y="23" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">AnimeAV1</text>
      <!-- Badge 2: JKAnime -->
      <rect x="145" y="0" width="130" height="36" rx="8" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4"/>
      <text x="210" y="23" text-anchor="middle" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">JKAnime</text>
      <!-- Badge 3: TioAnime -->
      <rect x="290" y="0" width="130" height="36" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316"/>
      <text x="355" y="23" text-anchor="middle" fill="#fdba74" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">TioAnime</text>
      <!-- Badge 4: AdBlock -->
      <rect x="435" y="0" width="140" height="36" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
      <text x="505" y="23" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">🛡️ AdBlock ON</text>
    </g>
  </g>

  <!-- Right Visual Mockup Graphic -->
  <g transform="translate(730, 95)">
    <!-- App Window Frame -->
    <rect width="400" height="440" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <!-- Titlebar -->
    <path d="M0 16C0 7.16344 7.16344 0 16 0H384C392.837 0 400 7.16344 400 16V40H0V16Z" fill="#1e293b"/>
    <circle cx="20" cy="20" r="6" fill="#ef4444"/>
    <circle cx="38" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="6" fill="#10b981"/>
    <text x="200" y="24" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">AnimeStream v1.0.4 - Windows</text>

    <!-- App Inner UI -->
    <rect x="15" y="55" width="370" height="150" rx="10" fill="#161f30" stroke="#243048"/>
    <!-- Player Hero Simulation -->
    <rect x="25" y="65" width="200" height="130" rx="8" fill="#0b0f19"/>
    <!-- Big Play Button -->
    <circle cx="125" cy="130" r="26" fill="#f47521"/>
    <polygon points="121,118 135,130 121,142" fill="#ffffff"/>
    
    <!-- Video details -->
    <rect x="240" y="75" width="130" height="14" rx="4" fill="#334155"/>
    <rect x="240" y="100" width="100" height="10" rx="3" fill="#1e293b"/>
    <rect x="240" y="120" width="80" height="10" rx="3" fill="#1e293b"/>
    <rect x="240" y="145" width="110" height="24" rx="6" fill="#10b981" fill-opacity="0.3"/>
    <text x="295" y="161" text-anchor="middle" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Sin Anuncios</text>

    <!-- Catalog Mini Cards -->
    <g transform="translate(15, 220)">
      <rect x="0" y="0" width="112" height="190" rx="8" fill="#161f30" stroke="#243048"/>
      <rect x="8" y="8" width="96" height="120" rx="6" fill="#1e293b"/>
      <rect x="8" y="138" width="80" height="10" rx="3" fill="#94a3b8"/>
      <rect x="8" y="156" width="50" height="8" rx="2" fill="#8b5cf6"/>

      <rect x="128" y="0" width="112" height="190" rx="8" fill="#161f30" stroke="#243048"/>
      <rect x="136" y="8" width="96" height="120" rx="6" fill="#1e293b"/>
      <rect x="136" y="138" width="80" height="10" rx="3" fill="#94a3b8"/>
      <rect x="136" y="156" width="50" height="8" rx="2" fill="#06b6d4"/>

      <rect x="256" y="0" width="112" height="190" rx="8" fill="#161f30" stroke="#243048"/>
      <rect x="264" y="8" width="96" height="120" rx="6" fill="#1e293b"/>
      <rect x="264" y="138" width="80" height="10" rx="3" fill="#94a3b8"/>
      <rect x="264" y="156" width="50" height="8" rx="2" fill="#f97316"/>
    </g>
  </g>
</svg>
