<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="auto">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Windows SmartScreen Dialog Frame -->
  <rect x="20" y="20" width="500" height="280" rx="8" fill="#005da6" filter="url(#shadow2)"/>
  
  <!-- Header Bar -->
  <text x="50" y="70" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600">Windows protegió su PC</text>
  
  <!-- Content text with app info -->
  <text x="50" y="110" fill="#e0f2fe" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">
    <tspan x="50" dy="0">Aplicación: AnimeStream.exe</tspan>
    <tspan x="50" dy="24">Editor: Editor desconocido (Código Abierto / GitHub)</tspan>
  </text>
  
  <!-- Bottom Buttons -->
  <!-- Step 2 Highlight: "Ejecutar de todas formas" -->
  <g transform="translate(140, 240)">
    <!-- Pulse Highlight Box -->
    <rect x="-4" y="-4" width="208" height="46" rx="6" fill="#f47521" fill-opacity="0.25" stroke="#f47521" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="0" y="0" width="200" height="38" rx="4" fill="#0078d4" stroke="#60a5fa" stroke-width="1"/>
    <text x="100" y="24" text-anchor="middle" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600">Ejecutar de todas formas</text>
  </g>
  
  <!-- Step 2 Badge Pointer -->
  <g transform="translate(50, 258)">
    <circle cx="16" cy="0" r="14" fill="#10b981"/>
    <text x="16" y="5" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">2</text>
  </g>

  <!-- Default Button (No ejecutar) -->
  <rect x="360" y="240" width="130" height="38" rx="4" fill="#004a85"/>
  <text x="425" y="264" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="400">No ejecutar</text>
</svg>
