plugins {
    id 'com.android.application'
}

android {
    namespace 'com.animestream.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.animestream.app"
        minSdk 21
        targetSdk 34
        versionCode 124
        versionName "1.2.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file("animestream.p12").exists()) {
                storeFile file("animestream.p12")
                storeType "PKCS12"
                storePassword "animestream_release_key"
                keyAlias "animestream"
                keyPassword "animestream_release_key"
            }
        }
    }

    buildTypes {
        debug {
            if (file("animestream.p12").exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("animestream.p12").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Rename output APK to AnimeStream.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "AnimeStream-${variant.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
