name: Compilar Flutter Multiplataforma (Android .apk, Windows .exe, Linux)

on:
  workflow_dispatch:
  push:
    paths:
      - 'animestream_flutter/**'
      - '.github/workflows/build-flutter.yml'

jobs:
  # ============================================================================
  # 1. COMPILACIÓN ANDROID (.apk)
  # ============================================================================
  build-android:
    name: Compilar Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias Flutter
        run: |
          cd animestream_flutter
          flutter pub get

      - name: Compilar APK Release
        run: |
          cd animestream_flutter
          flutter build apk --release

      - name: Subir APK de Android
        uses: actions/upload-artifact@v6
        with:
          name: AnimeStream-Flutter-Android-apk
          path: animestream_flutter/build/app/outputs/flutter-apk/app-release.apk

  # ============================================================================
  # 2. COMPILACIÓN WINDOWS (.exe)
  # ============================================================================
  build-windows:
    name: Compilar Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Habilitar Windows Desktop en Flutter
        run: flutter config --enable-windows-desktop

      - name: Instalar dependencias Flutter
        run: |
          cd animestream_flutter
          flutter pub get

      - name: Compilar Windows Release (.exe)
        run: |
          cd animestream_flutter
          flutter build windows --release

      - name: Subir ejecutable de Windows
        uses: actions/upload-artifact@v6
        with:
          name: AnimeStream-Flutter-Windows
          path: animestream_flutter/build/windows/x64/runner/Release/

  # ============================================================================
  # 3. COMPILACIÓN LINUX
  # ============================================================================
  build-linux:
    name: Compilar Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Instalar dependencias de compilación Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Habilitar Linux Desktop en Flutter
        run: flutter config --enable-linux-desktop

      - name: Instalar dependencias Flutter
        run: |
          cd animestream_flutter
          flutter pub get

      - name: Compilar Linux Release
        run: |
          cd animestream_flutter
          flutter build linux --release

      - name: Subir binario de Linux
        uses: actions/upload-artifact@v6
        with:
          name: AnimeStream-Flutter-Linux
          path: animestream_flutter/build/linux/x64/release/bundle/
