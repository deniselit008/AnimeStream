name: Compilar Ejecutables e Instaladores (Windows .exe, Linux ELF, Android .apk)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la release en GitHub (ej. 1.1.0 o v1.1.0)'
        required: false
        default: '1.1.0'
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. COMPILACIÓN WINDOWS (.exe)
  # ============================================================================
  build-windows:
    name: Compilar Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar instalador y portable de Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir binarios .exe de Windows
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-Windows-exe
          path: |
            dist/*.exe

  # ============================================================================
  # 2. COMPILACIÓN LINUX (Binario ELF / .AppImage)
  # ============================================================================
  build-linux:
    name: Compilar Linux (Binario ELF & AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar binario ELF de Linux
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir binario ELF y AppImage de Linux
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-Linux-ELF
          path: |
            dist/*.AppImage
            dist/*.deb

  # ============================================================================
  # 3. COMPILACIÓN ANDROID (.apk)
  # ============================================================================
  build-android:
    name: Compilar Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Sincronizar activos web en el proyecto Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/

      - name: Otorgar permisos a gradlew y verificar wrapper
        run: |
          cd android
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -Lo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Compilar APK con Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar y preparar APK
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/*.apk dist/android/AnimeStream.apk || true

      - name: Subir paquete .apk de Android
        uses: actions/upload-artifact@v4
        with:
          name: AnimeStream-Android-apk
          path: |
            dist/android/AnimeStream.apk
            android/app/build/outputs/apk/**/*.apk

  # ============================================================================
  # 4. PUBLICAR EN GITHUB RELEASES (.exe, .AppImage, .apk)
  # ============================================================================
  release:
    name: Publicar Release Multiplataforma
    needs: [build-windows, build-linux, build-android]
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Determinar etiqueta de release
        id: get_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=1.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Descargar artefactos de Windows
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AnimeStream-Windows-exe
          path: release-assets/windows

      - name: Descargar artefactos de Linux
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AnimeStream-Linux-ELF
          path: release-assets/linux

      - name: Descargar artefactos de Android
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: AnimeStream-Android-apk
          path: release-assets/android

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: |
            release-assets/windows/*.exe
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
            release-assets/android/*.apk
          generate_release_notes: true
